tags:
  - Contacts
summary: Patch contact
operationId: patchContact
description: 'Update Contact'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '688b76bd8a7f7cdfe92745f4'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          _id:
            description: "Contact's id"
            type: string
            example: 68b70d97baa33efd58909851
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+3800000000026'
          isFavorite:
            description: 'Whether the contact is a favorite'
            type: boolean
            example: true
          contactType:
            description: 'Contact type. One of three: "work", "home" or "personal"'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: 'User ID that owns the contact'
            type: string
            example: 68b70d97baa33efd58909851
          photo:
            description: "Link to student's photo"
            type: string
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
responses:
  '200':
    description: 'Patch contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
